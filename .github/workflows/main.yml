name: Build APK with P4A

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lldb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Cython==0.29.33 kivy
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Build APK
      run: |
        p4a create \
          --private . \
          --package=org.stream.screenstreamer \
          --name="Screen Streamer" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy \
          --orientation=portrait \
          --arch arm64-v8a \
          --android-api 31

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: "*.apk"
